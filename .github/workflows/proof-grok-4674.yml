name: proof-grok-4674

# Fork-only proof for steipete/CodexBar#4679 (issue #4674). This workflow is not
# part of the fix branch and must never be merged upstream. It runs on
# GitHub-hosted Linux runners, which are available to forks, and demonstrates a
# red/green cycle for the shipped ACP unknown-usage enrichment:
#
#   1. focused regression on the fixed tree -> must pass
#   2. shipped `CodexBarCLI usage --provider grok` on the fixed tree against a
#      local TLS stub for grok.com -> must gain the weekly 0% window
#   3. same CLI with the billing stub stopped -> wallet retained, usage unknown
#   4. only the fetch() enrichment wiring reverted -> focused regression and
#      CLI must both lose the window again (the #4674 before state)

on:
  push:
    branches:
      - "proof/grok-4674-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-grok-4674-${{ github.ref }}
  cancel-in-progress: true

env:
  PROOF_TLS_DIR: /tmp/proof-tls
  PROOF_FIXTURE: /tmp/proof-4674-fixture

jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libcurl4-openssl-dev

      - name: Install Swift 6.2 toolchain
        run: |
          set -euo pipefail
          SWIFT_VERSION="6.2"
          TARBALL="swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          curl -fL --retry 3 \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/${TARBALL}" \
            -o "/tmp/${TARBALL}"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "/tmp/${TARBALL}" -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "${GITHUB_PATH}"

      - name: Show toolchain
        run: |
          swift --version
          git log --oneline -3

      - name: HEAD tree - focused #4674 regression must PASS (green)
        run: |
          set -euo pipefail
          echo "=== HEAD tree: ACP unknown-usage enrichment wiring present ==="
          swift test --filter GrokACPUnknownUsageLinuxTests 2>&1 | tee head-test.log
          echo "HEAD_PASS_CONFIRMED: focused #4674 regression passed with the fix"

      - name: HEAD tree - build shipped CodexBarCLI, start local grok.com TLS billing stub
        run: |
          set -euo pipefail
          TLS="${PROOF_TLS_DIR}"
          mkdir -p "${TLS}"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "${TLS}/ca.key" -out "${TLS}/ca.pem" -days 2 \
            -subj "/CN=CodexBar 4674 proof CA" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "${TLS}/server.key" -out "${TLS}/server.csr" \
            -subj "/CN=grok.com" >/dev/null 2>&1
          printf 'subjectAltName=DNS:grok.com,DNS:cli-chat-proxy.grok.com\n' > "${TLS}/server.ext"
          openssl x509 -req -in "${TLS}/server.csr" -CA "${TLS}/ca.pem" -CAkey "${TLS}/ca.key" \
            -CAcreateserial -out "${TLS}/server.pem" -days 2 -extfile "${TLS}/server.ext" >/dev/null 2>&1
          sudo cp "${TLS}/ca.pem" /usr/local/share/ca-certificates/proof-4674-ca.crt
          sudo update-ca-certificates >/dev/null
          cat /etc/ssl/certs/ca-certificates.crt > "${TLS}/bundle.pem"
          sudo sh -c 'grep -q "127.0.0.1 grok.com" /etc/hosts || printf "127.0.0.1 grok.com\n127.0.0.1 cli-chat-proxy.grok.com\n" >> /etc/hosts'
          python3 .github/proof-4674/make_fixture.py "${PROOF_FIXTURE}"
          sudo sh -c "PROOF_TLS_DIR='${TLS}' python3 .github/proof-4674/grpc_stub.py 443 > '${TLS}/stub.log' 2>&1 & echo \$! > '${TLS}/stub.pid'"
          ready=0
          for _ in $(seq 1 30); do
            if curl -s --cacert "${TLS}/bundle.pem" https://grok.com/v1/settings >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" -ne 1 ]; then
            cat "${TLS}/stub.log" || true
            exit 1
          fi
          echo "local grok.com TLS billing stub ready"
          echo "=== stub log after readiness probe ==="
          cat "${TLS}/stub.log" || true
          swift build --product CodexBarCLI
          BIN="$(swift build --product CodexBarCLI --show-bin-path)/CodexBarCLI"
          echo "PROOF_CLI=${BIN}" >> "${GITHUB_ENV}"
          echo "SSL_CERT_FILE=${TLS}/bundle.pem" >> "${GITHUB_ENV}"
          echo "CURL_CA_BUNDLE=${TLS}/bundle.pem" >> "${GITHUB_ENV}"

      - name: Foundation TLS probe - diagnose URLSession trust for the stub
        run: |
          set -euo pipefail
          cat > /tmp/tlsprobe.swift <<'SWIFT'
          import Foundation
          #if canImport(FoundationNetworking)
          import FoundationNetworking
          #endif

          let semaphore = DispatchSemaphore(value: 0)
          var outcome = "PENDING"
          var request = URLRequest(url: URL(string: "https://grok.com/v1/settings")!)
          request.httpMethod = "GET"
          request.timeoutInterval = 10
          URLSession.shared.dataTask(with: request) { data, response, error in
              if let error {
                  outcome = "ERROR: \(error)"
              } else {
                  let status = (response as? HTTPURLResponse)?.statusCode ?? -1
                  let body = String(data: data ?? Data(), encoding: .utf8) ?? "<non-utf8>"
                  outcome = "OK: status=\(status) body=\(body)"
              }
              semaphore.signal()
          }.resume()
          semaphore.wait()
          print("FOUNDATION_TLS_PROBE \(outcome)")
          SWIFT
          swiftc -o /tmp/tlsprobe /tmp/tlsprobe.swift
          /tmp/tlsprobe | tee /tmp/tlsprobe.out
          echo "=== stub log after Foundation TLS probe ==="
          cat "${PROOF_TLS_DIR}/stub.log" || true

      - name: HEAD tree - shipped CLI usage must gain the weekly 0% window
        run: |
          set -euo pipefail
          set +e
          env HOME="${PROOF_FIXTURE}/home" GROK_HOME="${PROOF_FIXTURE}/home/.grok" \
            GROK_CLI_PATH="${PROOF_FIXTURE}/grok-fixture" PATH="/usr/bin:/bin" \
            "${PROOF_CLI}" usage --provider grok --source cli --format json --log-level debug -v \
            > /tmp/cli-head.json 2>/tmp/cli-head.err
          status=$?
          set -e
          echo "CLI exit status: ${status}"
          echo "--- shipped CLI JSON (head tree) ---"
          cat /tmp/cli-head.json
          echo "--- stderr ---"
          cat /tmp/cli-head.err || true
          echo "=== stub log after shipped CLI ==="
          cat "${PROOF_TLS_DIR}/stub.log" || true
          python3 .github/proof-4674/assert_usage.py /tmp/cli-head.json head \
            2>&1 | tee cli-head-assert.log
          echo "HEAD_CLI_PROOF_DONE"

      - name: Wallet-only proof - enrichment unavailable keeps prepaid balance without a window
        run: |
          set -euo pipefail
          sudo kill "$(cat "${PROOF_TLS_DIR}/stub.pid")" 2>/dev/null || true
          sleep 1
          set +e
          env HOME="${PROOF_FIXTURE}/home" GROK_HOME="${PROOF_FIXTURE}/home/.grok" \
            GROK_CLI_PATH="${PROOF_FIXTURE}/grok-fixture" PATH="/usr/bin:/bin" \
            "${PROOF_CLI}" usage --provider grok --source cli --format json \
            > /tmp/cli-wallet-only.json 2>/tmp/cli-wallet-only.err
          status=$?
          set -e
          echo "CLI exit status with billing stub stopped: ${status}"
          echo "--- shipped CLI JSON (enrichment unavailable) ---"
          cat /tmp/cli-wallet-only.json
          cat /tmp/cli-wallet-only.err || true
          python3 .github/proof-4674/assert_usage.py /tmp/cli-wallet-only.json wallet-only \
            2>&1 | tee cli-wallet-only-assert.log
          echo "WALLET_ONLY_PROOF_DONE"

      - name: Reverted wiring - focused #4674 regression must FAIL (expected red)
        run: |
          set -euo pipefail
          echo "=== proof variant: remove only the fetch() ACP enrichment wiring ==="
          git apply .github/proof-4674/revert-acp-enrichment-wiring.patch
          git --no-pager diff --stat
          set +e
          swift test --filter GrokACPUnknownUsageLinuxTests > reverted-test.log 2>&1
          status=$?
          set -e
          echo "reverted tree focused-test exit status: ${status}"
          tail -n 150 reverted-test.log || true
          if [ "${status}" -eq 0 ]; then
            echo "UNEXPECTED_PASS: regression passed without the fix; the test is not failing-before-fix"
            exit 1
          fi
          echo "EXPECTED_RED_CONFIRMED: focused #4674 regression fails with ACP enrichment wiring removed"
          grep -nE "GrokACPUnknownUsageLinuxTests|Expectation failed|failed|#expect" reverted-test.log \
            | head -60 || true

      - name: Reverted wiring - shipped CLI usage must lose the weekly window (before state)
        run: |
          set -euo pipefail
          TLS="${PROOF_TLS_DIR}"
          sudo sh -c "PROOF_TLS_DIR='${TLS}' python3 .github/proof-4674/grpc_stub.py 443 >> '${TLS}/stub.log' 2>&1 & echo \$! > '${TLS}/stub.pid'"
          ready=0
          for _ in $(seq 1 30); do
            if curl -s --cacert "${TLS}/bundle.pem" https://grok.com/v1/settings >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" -ne 1 ]; then
            cat "${TLS}/stub.log" || true
            exit 1
          fi
          echo "--- rebuild CodexBarCLI with the enrichment wiring reverted ---"
          swift build --product CodexBarCLI
          set +e
          env HOME="${PROOF_FIXTURE}/home" GROK_HOME="${PROOF_FIXTURE}/home/.grok" \
            GROK_CLI_PATH="${PROOF_FIXTURE}/grok-fixture" PATH="/usr/bin:/bin" \
            "${PROOF_CLI}" usage --provider grok --source cli --format json \
            > /tmp/cli-before.json 2>/tmp/cli-before.err
          status=$?
          set -e
          echo "CLI exit status on reverted tree: ${status}"
          echo "--- shipped CLI JSON (reverted wiring, billing stub running) ---"
          cat /tmp/cli-before.json
          cat /tmp/cli-before.err || true
          python3 .github/proof-4674/assert_usage.py /tmp/cli-before.json before \
            2>&1 | tee cli-before-assert.log
          sudo kill "$(cat "${TLS}/stub.pid")" 2>/dev/null || true
          echo "BEFORE_PROOF_DONE"
