# FORK-ONLY WORKFLOW — real running-app menu proof for upstream CodexBar PR #4733.
#
# Builds the actual CodexBar.app on a GitHub-hosted macos-26 runner (real Aqua/WindowServer
# session), installs a fixture user provider plugin served from a loopback HTTP endpoint, and
# captures the production status-item menu card across the refresh states of issue #4726:
#   success            — 42% used / 58% left, no error
#   success-failure    — retained usage + red HTTP-500 error + "Showing last-known usage captured …"
#   failure-only       — error-only card with no cached usage rows
#   recovery           — error cleared after a later success, no last-known line
# Each state is produced through the production refresh path
# (`UsageStore.refreshUserPlugin` + `ProviderPluginApprovalStore`), then the real status-item menu
# is opened through the production `StatusItemController.openMenuFromShortcut()` path and the live
# menu window is captured with `screencapture -l`.
#
# Never intended for upstream: this file lives only on proof/* branches of the fork.
name: proof-plugin-stale-error

on:
  push:
    branches: ["proof/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-proof:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner and GUI fact sheet
        run: |
          set +e
          echo "=== git head ==="; git log --oneline -1; git status --short --branch | head -5
          echo "=== sw_vers ==="; sw_vers
          echo "=== xcodebuild ==="; xcodebuild -version
          echo "=== swift ==="; swift --version
          echo "=== console user ==="; stat -f%Su /dev/console
          echo "=== launchctl gui ==="; launchctl print "gui/$(id -u)" 2>&1 | grep -E "type = |session = |creator = " | head -5
          echo "=== WindowServer ==="; pgrep -lx WindowServer
          echo "=== AppleLanguages ==="; defaults read -g AppleLanguages 2>&1
          echo "=== probe screencapture ==="; screencapture -x /tmp/desktop-probe.png && file /tmp/desktop-probe.png && sips -g pixelWidth -g pixelHeight /tmp/desktop-probe.png
          echo "=== disk ==="; df -h / | tail -1

      - name: Restore SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: proof-swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-v1
          restore-keys: |
            proof-swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            proof-swiftpm-${{ runner.os }}-

      - name: Build and package CodexBar.app (debug, ad-hoc signed)
        run: |
          set -eo pipefail
          echo "Starting build: $(date -u +%FT%TZ)"
          CODEXBAR_SIGNING=adhoc CODEXBAR_PROOF_SKIP_WIDGET_EXTENSION=1 \
            ./Scripts/package_app.sh debug 2>&1 | tee "$RUNNER_TEMP/build-package.log"
          echo "Finished build: $(date -u +%FT%TZ)"
          echo "=== packaged app ==="
          ls -la CodexBar.app/Contents/MacOS
          echo "bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' CodexBar.app/Contents/Info.plist)"
          echo "git commit: $(/usr/libexec/PlistBuddy -c 'Print :CodexGitCommit' CodexBar.app/Contents/Info.plist)"
          echo "build timestamp: $(/usr/libexec/PlistBuddy -c 'Print :CodexBuildTimestamp' CodexBar.app/Contents/Info.plist)"
          codesign -dv CodexBar.app 2>&1 | head -5
          du -sh .build

      - name: Install fixture user provider plugin
        run: |
          set -eo pipefail
          PLUGIN_DIR="$HOME/.config/codexbar/providers"
          mkdir -p "$PLUGIN_DIR"
          cat > "$PLUGIN_DIR/fixture-stale-proof.js" <<'JS'
          defineProvider({
            id: "fixture-stale-proof",
            name: "Fixture Usage",
            topLevel: true,
            endpoints: [{ setting: "BASE_URL", policy: "https-or-loopback-http" }],
            settings: [{ key: "BASE_URL", title: "Base URL", type: "plain" }],
            capabilities: ["http-status"],
            async fetchUsage(ctx) {
              const base = (ctx.settings.get("BASE_URL") || "http://127.0.0.1:8765").replace(/\/+$/u, "");
              const response = await ctx.http.get(base + "/usage");
              if (response.status !== 200) {
                throw ctx.fail.apiFailure(
                  "Usage request failed (HTTP " + response.status + "): fixture endpoint stopped responding.",
                );
              }
              const payload = JSON.parse(response.bodyText);
              return { primary: { usedPercent: payload.used, windowMinutes: 300 } };
            },
          });
          JS
          echo "=== fixture plugin installed ==="
          ls -la "$PLUGIN_DIR"
          cat "$PLUGIN_DIR/fixture-stale-proof.js"

      - name: Capture the real status-item menu across all refresh states
        run: |
          set +e
          APP="$PWD/CodexBar.app"
          OUT="$PWD/proof-out"
          PROOF_DIR=/tmp/codexbar-proof
          mkdir -p "$OUT"
          rm -rf "$PROOF_DIR"
          mkdir -p "$PROOF_DIR"
          failures=0

          cat > "$RUNNER_TEMP/dump-windows.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let windows = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] ?? []
          for window in windows {
              let owner = window[kCGWindowOwnerName as String] as? String ?? "?"
              if !owner.lowercased().contains("codexbar") { continue }
              let number = window[kCGWindowNumber as String] as? Int ?? -1
              let layer = window[kCGWindowLayer as String] as? Int ?? -99
              let alpha = window[kCGWindowAlpha as String] as? Double ?? -1
              let onscreen = window[kCGWindowIsOnscreen as String] as? Bool ?? false
              let bounds = window[kCGWindowBounds as String] ?? "?"
              print("owner=\(owner) number=\(number) layer=\(layer) alpha=\(alpha) onscreen=\(onscreen) bounds=\(bounds)")
          }
          SWIFT

          cat > "$RUNNER_TEMP/fixture_server.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          MODE_FILE = "/tmp/codexbar-proof/server_mode"

          class Handler(BaseHTTPRequestHandler):
              def _send(self, status, body):
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  mode = "success"
                  try:
                      with open(MODE_FILE) as handle:
                          mode = handle.read().strip() or "success"
                  except OSError:
                      pass
                  if mode == "fail":
                      self._send(500, b'{"error":"fixture endpoint stopped responding"}')
                      return
                  self._send(200, json.dumps({"used": 42, "resets_in_seconds": 3600}).encode())

              def log_message(self, *args):
                  pass

          HTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY
          python3 -u "$RUNNER_TEMP/fixture_server.py" > "$OUT/fixture-server.log" 2>&1 &
          SERVER_PID=$!
          sleep 1

          capture_round() {
            local state="$1"
            local round="$2"
            sleep 2.0
            screencapture -x "$OUT/menu-screen-$state-$round.png"
            swift "$RUNNER_TEMP/dump-windows.swift" > "$OUT/windows-$state-$round.txt" 2>&1
            cat "$OUT/windows-$state-$round.txt"
            python3 - "$OUT/windows-$state-$round.txt" > "$OUT/window-numbers-$state-$round.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          for chunk in text.split('owner=')[1:]:
              if 'onscreen=true' not in chunk:
                  continue
              number = re.search(r'number=(\d+)', chunk)
              height = re.search(r'Height = (\d+)', chunk)
              if not number:
                  continue
              h = int(height.group(1)) if height else 0
              if h >= 80:
                  print(number.group(1))
          PY
            while read -r num; do
              [ -n "$num" ] && screencapture -x -l "$num" "$OUT/window-$state-$round-$num.png"
            done < "$OUT/window-numbers-$state-$round.txt"
          }

          for state in success success-failure failure-only recovery; do
            echo "=================== state=$state ==================="
            pkill -x CodexBar 2>/dev/null
            sleep 1
            rm -rf "$PROOF_DIR"
            mkdir -p "$PROOF_DIR"
            echo "$state" > "$PROOF_DIR/state"
            case "$state" in
              failure-only) echo "fail" > "$PROOF_DIR/server_mode" ;;
              *) echo "success" > "$PROOF_DIR/server_mode" ;;
            esac
            LOG="$OUT/app-$state.log"
            "$APP/Contents/MacOS/CodexBar" >"$LOG" 2>&1 &
            echo "$(date -u +%H:%M:%S) launch state=$state pid=$!"
            MARKER="$PROOF_DIR/marker-state-$state.json"
            for i in $(seq 1 1200); do
              [ -f "$MARKER" ] && break
              sleep 0.5
            done
            if [ ! -f "$MARKER" ]; then
              echo "ERROR: no harness marker for state=$state; app log follows"
              tail -80 "$LOG"
              failures=$((failures + 1))
              pkill -x CodexBar 2>/dev/null
              sleep 2
              pkill -9 -x CodexBar 2>/dev/null
              continue
            fi
            cp "$MARKER" "$OUT/"
            cp "$PROOF_DIR/runtime-evidence-$state.txt" "$OUT/" 2>/dev/null
            echo "=== $state marker ==="
            cat "$MARKER"
            capture_round "$state" 1
            capture_round "$state" 2
            echo "=== $state harness runtime evidence (redacted) ==="
            grep "\[proof-harness\]" "$LOG" | sed 's/^\[proof-harness\] //' | head -120
            echo "=== $state app stdout tail ==="
            tail -20 "$LOG"
            pkill -x CodexBar 2>/dev/null
            sleep 2
            pkill -9 -x CodexBar 2>/dev/null
          done

          kill "$SERVER_PID" 2>/dev/null

          echo "=== fixture server log ==="
          cat "$OUT/fixture-server.log"
          ls -la "$OUT"
          for state in success success-failure failure-only recovery; do
            [ -s "$OUT/menu-screen-$state-1.png" ] || { echo "MISSING screen capture for $state"; failures=$((failures + 1)); }
            [ -s "$OUT/marker-state-$state.json" ] || { echo "MISSING marker for $state"; failures=$((failures + 1)); }
          done
          echo "failures=$failures"
          if [ "$failures" -ne 0 ]; then
            echo "PROOF CAPTURE INCOMPLETE"
            exit 1
          fi
          echo "PROOF CAPTURE OK"

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          mkdir -p proof-out
          cp "$RUNNER_TEMP/build-package.log" proof-out/ 2>/dev/null
          cp "$RUNNER_TEMP/dump-windows.swift" proof-out/ 2>/dev/null
          cp "$RUNNER_TEMP/fixture_server.py" proof-out/ 2>/dev/null
          cp -R /tmp/codexbar-proof proof-out/proof-dir 2>/dev/null
          cp /tmp/desktop-probe.png proof-out/ 2>/dev/null
          cp "$HOME/.config/codexbar/providers/fixture-stale-proof.js" proof-out/ 2>/dev/null
          true

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-proof-4726
          path: proof-out
          if-no-files-found: warn
